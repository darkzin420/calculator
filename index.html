<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora PIX - Pague para Ver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cyber-glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(34, 197, 94, 0.2);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }
        .screen-glow {
            box-shadow: inset 0 0 15px rgba(34, 197, 94, 0.15);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-mono">

    <div class="w-full max-w-md cyber-glass rounded-2xl p-6 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-green-500 to-emerald-400"></div>
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black tracking-wider text-green-400 flex items-center justify-center gap-2">
                <span>⚡</span> CALCULADORA PIX
            </h1>
            <p class="text-xs text-slate-400 mt-1">Cada cálculo custa <strong class="text-green-400">R$ 5,00</strong> via PIX</p>
        </div>

        <!-- Tela da Calculadora -->
        <div class="mb-6 bg-slate-900 rounded-xl p-4 border border-slate-800 screen-glow relative">
            <div id="expressao" class="text-xs text-slate-400 h-6 overflow-x-auto text-right tracking-widest">0</div>
            <div id="display" class="text-3xl font-bold text-right text-green-400 tracking-wider overflow-x-auto">0</div>
            
            <!-- Overlay de Bloqueio (Resultado Oculto) -->
            <div id="overlay-bloqueio" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-xl flex flex-col items-center justify-center p-4 text-center hidden">
                <span class="text-2xl mb-1">🔒</span>
                <p class="text-sm font-bold text-amber-400">RESULTADO BLOQUEADO</p>
                <p class="text-xs text-slate-400 mt-1">Pague R$ 5,00 para desbloquear</p>
                <button onclick="abrirModalPagamento()" class="mt-3 bg-green-500 hover:bg-green-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs transition shadow-lg shadow-green-500/20">
                    VER CHAVE PIX / PAGAR
                </button>
            </div>
        </div>

        <!-- Teclado -->
        <div class="grid grid-cols-4 gap-2">
            <button onclick="limpar()" class="bg-red-500/20 border border-red-500/30 hover:bg-red-500/30 text-red-400 p-4 rounded-xl font-bold transition">C</button>
            <button onclick="apagarUltimo()" class="bg-slate-800 hover:bg-slate-700 p-4 rounded-xl font-bold transition">⌫</button>
            <button onclick="inserir('(')" class="bg-slate-800 hover:bg-slate-700 p-4 rounded-xl font-bold transition">(</button>
            <button onclick="inserir('/')" class="bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 p-4 rounded-xl font-bold transition">÷</button>

            <button onclick="inserir('7')" class="bg-slate-900 hover:bg-slate-800 p-4 rounded-xl font-bold transition">7</button>
            <button onclick="inserir('8')" class="bg-slate-900 hover:bg-slate-800 p-4 rounded-xl font-bold transition">8</button>
            <button onclick="inserir('9')" class="bg-slate-900 hover:bg-slate-800 p-4 rounded-xl font-bold transition">9</button>
            <button onclick="inserir('*')" class="bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 p-4 rounded-xl font-bold transition">×</button>

            <button onclick="inserir('4')" class="bg-slate-900 hover:bg-slate-800 p-4 rounded-xl font-bold transition">4</button>
            <button onclick="inserir('5')" class="bg-slate-900 hover:bg-slate-800 p-4 rounded-xl font-bold transition">5</button>
            <button onclick="inserir('6')" class="bg-slate-900 hover:bg-slate-800 p-4 rounded-xl font-bold transition">6</button>
            <button onclick="inserir('-')" class="bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 p-4 rounded-xl font-bold transition">-</button>

            <button onclick="inserir('1')" class="bg-slate-900 hover:bg-slate-800 p-4 rounded-xl font-bold transition">1</button>
            <button onclick="inserir('2')" class="bg-slate-900 hover:bg-slate-800 p-4 rounded-xl font-bold transition">2</button>
            <button onclick="inserir('3')" class="bg-slate-900 hover:bg-slate-800 p-4 rounded-xl font-bold transition">3</button>
            <button onclick="inserir('+')" class="bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 p-4 rounded-xl font-bold transition">+</button>

            <button onclick="inserir('0')" class="col-span-2 bg-slate-900 hover:bg-slate-800 p-4 rounded-xl font-bold transition">0</button>
            <button onclick="inserir('.')" class="bg-slate-900 hover:bg-slate-800 p-4 rounded-xl font-bold transition">.</button>
            <button onclick="calcular()" class="bg-green-500 hover:bg-green-400 text-slate-950 p-4 rounded-xl font-bold transition shadow-lg shadow-green-500/20">=</button>
        </div>
    </div>

    <!-- Modal de Pagamento PIX -->
    <div id="modal-pagamento" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="cyber-glass rounded-2xl p-6 max-w-sm w-full text-center relative border border-green-500/40">
            <h3 class="text-lg font-bold text-green-400 mb-2">Pague para Ver o Resultado</h3>
            <p class="text-xs text-slate-400 mb-4">Chave PIX (Telefone): <strong class="text-white">32991261878</strong></p>
            
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 mb-4 text-xs text-slate-300">
                <span id="qr-code-texto" class="text-green-300">Gerando cobrança...</span>
            </div>

            <div class="flex flex-col gap-2">
                <button onclick="copiarChave()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-xl text-xs font-bold transition">
                    📋 Copiar Chave PIX (32991261878)
                </button>
                <button onclick="fecharModal()" class="text-slate-500 hover:text-slate-400 text-xs mt-2">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        let valorAtual = "0";
        let expressaoCompleta = "";
        let resultadoCalculado = null;
        let paymentIdAtual = null;

        function atualizarDisplay() {
            document.getElementById('display').innerText = valorAtual;
            document.getElementById('expressao').innerText = expressaoCompleta || "0";
        }

        function inserir(char) {
            if (valorAtual === "0" && !isNaN(char)) {
                valorAtual = char;
            } else {
                valorAtual += char;
            }
            atualizarDisplay();
        }

        function limpar() {
            valorAtual = "0";
            expressaoCompleta = "";
            resultadoCalculado = null;
            document.getElementById('overlay-bloqueio').classList.add('hidden');
            atualizarDisplay();
        }

        function apagarUltimo() {
            valorAtual = valorAtual.length > 1 ? valorAtual.slice(0, -1) : "0";
            atualizarDisplay();
        }

        async function calcular() {
            try {
                expressaoCompleta = valorAtual;
                let evalStr = valorAtual.replace(/×/g, '*').replace(/÷/g, '/');
                resultadoCalculado = eval(evalStr);
                
                valorAtual = String(resultadoCalculado);
                atualizarDisplay();

                document.getElementById('overlay-bloqueio').classList.remove('hidden');
                document.getElementById('qr-code-texto').innerText = "Gerando PIX de R$ 5,00...";

                const response = await fetch('/api/calcular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ expressao: expressaoCompleta, resultado: resultadoCalculado })
                });

                const data = await response.json();
                paymentIdAtual = data.paymentId;
                document.getElementById('qr-code-texto').innerText = "Chave: 32991261878 (R$ 5,00)";

                // Inicia verificação automática a cada 3 segundos para ver se você aprovou no painel
                verificarIntervalo = setInterval(checarAprovacao, 3000);

            } catch (error) {
                alert("Erro ao calcular expressão.");
            }
        }

        async function checarAprovacao() {
            if (!paymentIdAtual) return;
            try {
                const res = await fetch(`/api/verificar/${paymentIdAtual}`);
                const data = await res.json();
                if (data.status === 'approved') {
                    clearInterval(verificarIntervalo);
                    fecharModal();
                    document.getElementById('overlay-bloqueio').classList.add('hidden');
                    alert("Pagamento aprovado pelo administrador! Resultado liberado.");
                }
            } catch (e) {}
        }

        function abrirModalPagamento() {
            document.getElementById('modal-pagamento').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modal-pagamento').classList.add('hidden');
        }

        function copiarChave() {
            navigator.clipboard.writeText("32991261878");
            alert("Chave PIX copiada: 32991261878");
        }
    </script>
</body>
</html>
